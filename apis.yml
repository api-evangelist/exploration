name: The Exploration Company
description: >-
  The Exploration Company GmbH is a European space transportation startup building reusable space
  vehicles "for humanity." Its flagship program, Nyx, is a reusable capsule designed to carry cargo
  and, eventually, crew between Earth and low Earth orbit destinations such as commercial space
  stations, featuring orbital propulsion, autonomous docking, and re-entry recovery. The company is
  also developing Storm, a high-thrust reusable rocket engine (up to 180 tons of thrust) built through
  European partnerships toward a globally competitive launcher. Backed by Balderton Capital and a
  certified B Corp, it markets itself as one of the fastest-growing space startups in the world. The
  company operates a marketing and careers web presence but publishes no public developer program,
  API, SDKs, or machine-readable API artifacts at this time. Surfaced as a Balderton Capital portfolio
  company and enriched in the API Evangelist network with verified identity and domain-security signals.
